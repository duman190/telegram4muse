[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram4muse"
version = "0.1.0"
description = "Lets the Muse agent post polls and messages to your allowed Telegram groups, as you, from your Mac over Tailscale."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    # 1.45 speaks Telegram API layer 229, whose poll format this code uses.
    "telethon>=1.45,<2",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
t4m = "telegram4muse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
