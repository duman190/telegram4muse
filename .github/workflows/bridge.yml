name: Bridge

on:
  push:
    paths:
      - "bridge/**"
      - "ios/T4MCore/Tests/T4MCoreTests/Fixtures/**"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "ios/T4MCore/Tests/T4MCoreTests/Fixtures/**"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: bridge
        run: npm test
